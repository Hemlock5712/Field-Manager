# Serve only the Pi's VLAN 999 interface. Practice AP firmware owns team DHCP.
interface=fm-onboard
bind-dynamic
except-interface=lo
dhcp-authoritative
dhcp-range=10.99.0.50,10.99.0.250,255.255.255.0,15m
dhcp-option=option:router,10.99.0.1
dhcp-option=option:dns-server,10.99.0.1
dhcp-option=114,http://10.99.0.1/portal
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Onboarding DNS intentionally directs every name to the local captive portal.
no-hosts
no-resolv
address=/#/10.99.0.1
log-dhcp
