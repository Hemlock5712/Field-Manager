geo $field_manager_onboarding_client {
  default 0;
  ${FM_ONBOARDING_SUBNET} 1;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;

  location ^~ /api/portal/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Administrative APIs are reachable only from the management subnet.
  location /api/ {
    allow 127.0.0.1;
    allow 10.0.100.0/24;
    deny all;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /portal {
    try_files /index.html =404;
  }

  location ^~ /portal/ {
    try_files $uri $uri/ /index.html;
  }

  location ^~ /assets/ {
    try_files $uri =404;
  }

  location / {
    if ($field_manager_onboarding_client) {
      return 302 ${FM_ONBOARDING_PORTAL_URL};
    }
    try_files $uri $uri/ /index.html;
  }
}
